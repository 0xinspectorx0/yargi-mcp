<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  
  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#eab308" stroke-width="6" opacity="0.4" />
  <circle cx="256" cy="256" r="195" fill="#1e293b" opacity="0.6" />

  <!-- Center Pillar -->
  <circle cx="256" cy="115" r="18" fill="url(#goldGrad)" />
  <line x1="256" y1="130" x2="256" y2="380" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" />
  
  <!-- Pedestal -->
  <polygon points="170,400 342,400 256,365" fill="url(#goldGrad)" />
  <rect x="150" y="400" width="212" height="20" rx="6" fill="#ca8a04" />

  <!-- Horizontal Beam -->
  <line x1="110" y1="180" x2="402" y2="180" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" />

  <!-- Left Scale Pan -->
  <line x1="110" y1="180" x2="60" y2="280" stroke="#cbd5e1" stroke-width="3" />
  <line x1="110" y1="180" x2="160" y2="280" stroke="#cbd5e1" stroke-width="3" />
  <path d="M 50 280 Q 110 330 170 280 Z" fill="url(#goldGrad)" />

  <!-- Right Scale Pan -->
  <line x1="402" y1="180" x2="352" y2="280" stroke="#cbd5e1" stroke-width="3" />
  <line x1="402" y1="180" x2="452" y2="280" stroke="#cbd5e1" stroke-width="3" />
  <path d="M 342 280 Q 402 330 462 280 Z" fill="url(#goldGrad)" />
</svg>
